<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Plus</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --line: rgba(255, 255, 255, 0.12);
      --panel: hsl(220 16% 12% / 0.92);
      --primary: #5865f2;
      --ok: #34d399;
    }
    html.light {
      color-scheme: light;
      --ink: #0f172a;
      --muted: #475569;
      --line: rgba(15, 23, 42, 0.12);
      --panel: rgba(255, 255, 255, 0.94);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: inherit, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 0; }
    [hidden] { display: none !important; }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: var(--panel) !important;
      background-color: var(--panel) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: none;
      filter: none;
    }
    .row.hidden-state { display: none; }

    .copy { min-width: 0; flex: 1; }
    .title {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
    }
    .title svg {
      width: 1rem;
      height: 1rem;
      color: var(--primary);
      flex-shrink: 0;
    }
    .row.linked .title svg { color: var(--ok); }
    .lede {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.8125rem;
      line-height: 1.45;
      font-weight: 400;
    }
    .meta {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
    }
    .meta code {
      margin-left: 0.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.7rem;
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
      flex-shrink: 0;
    }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 0.5rem;
      padding: 0.5rem 0.85rem;
      font-weight: 500;
      font-size: 0.8125rem;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      line-height: 1;
      box-shadow: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: #4752c4; color: #fff; }
    .btn-secondary {
      background: transparent;
      color: var(--muted);
      padding-left: 0.35rem;
      padding-right: 0.35rem;
    }
    .btn-secondary:hover { color: var(--ink); }

    .loading, .error {
      min-height: 4.5rem;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 0.8125rem;
      background: var(--panel) !important;
      background-color: var(--panel) !important;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Checking Discord status…</div>
  <div id="error" class="error" hidden>Could not load Discord status.</div>

  <section id="widget" class="row hidden-state" hidden>
    <div class="copy">
      <h1 class="title" id="title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.07.07 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        <span id="title-text">Connect Discord</span>
      </h1>
      <p class="lede" id="message">Link your Discord account to unlock servers and other resources.</p>
      <div class="meta" id="meta"></div>
    </div>

    <div class="actions" id="actions">
      <a class="btn btn-primary" id="link-btn" href="/api/user/auth/discord/link" target="_top" rel="noopener">
        <span id="link-label">Link Discord</span>
      </a>
      <a class="btn btn-secondary" id="account-btn" href="/dashboard/account?tab=settings" target="_top">Account settings</a>
    </div>
  </section>

  <script>
    function applyTheme(theme) {
      document.documentElement.classList.toggle('light', theme === 'light');
      document.documentElement.classList.toggle('dark', theme !== 'light');
    }

    async function fetchStatus() {
      const res = await fetch('/api/user/discordplus/status', {
        credentials: 'include',
        headers: { Accept: 'application/json' },
      });
      const json = await res.json();
      if (!res.ok || !json.success) throw new Error(json.message || 'Failed');
      return json.data;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function render(status) {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const widget = document.getElementById('widget');
      loading.hidden = true;
      error.hidden = true;

      if (!status.discord_oauth_enabled) {
        widget.hidden = true;
        widget.classList.add('hidden-state');
        return;
      }

      widget.hidden = false;
      widget.classList.remove('hidden-state', 'linked');

      const titleText = document.getElementById('title-text');
      const message = document.getElementById('message');
      const linkLabel = document.getElementById('link-label');
      const accountBtn = document.getElementById('account-btn');
      const linkBtn = document.getElementById('link-btn');
      const actions = document.getElementById('actions');
      const meta = document.getElementById('meta');

      accountBtn.setAttribute('href', status.account_url || '/dashboard/account?tab=settings');
      if (linkBtn) {
        linkBtn.setAttribute('href', status.link_url || '/api/user/auth/discord/link');
      }

      if (status.linked) {
        widget.classList.add('linked');
        titleText.textContent = 'Discord linked';
        message.textContent = 'Your Discord account is connected.';
        actions.hidden = true;
        const name = status.discord?.username || status.discord?.name || 'Discord user';
        const id = status.discord?.id || '';
        meta.innerHTML = `${escapeHtml(name)}${id ? ` <code>${escapeHtml(id)}</code>` : ''}`;
        return;
      }

      actions.hidden = false;
      meta.textContent = '';

      if (status.blocked || status.required) {
        titleText.textContent = 'Discord required';
        message.textContent = status.message || 'Link Discord before using servers, webspaces, or VMs.';
        if (linkLabel) linkLabel.textContent = 'Link Discord';
      } else {
        titleText.textContent = 'Connect Discord';
        message.textContent = status.message || 'Link Discord for easier login and account recovery.';
        if (linkLabel) linkLabel.textContent = 'Link Discord';
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'featherpanel-theme') {
        applyTheme(event.data.theme);
      }
    });

    const params = new URLSearchParams(window.location.search);
    applyTheme(params.get('__theme') === 'light' ? 'light' : 'dark');
    window.parent.postMessage({ type: 'featherpanel-ready' }, '*');

    fetchStatus()
      .then(render)
      .catch((err) => {
        document.getElementById('loading').hidden = true;
        const error = document.getElementById('error');
        error.hidden = false;
        error.textContent = err.message || 'Could not load Discord status.';
      });
  </script>
</body>
</html>
